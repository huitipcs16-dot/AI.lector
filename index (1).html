<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manga Lector IA — Slime</title>
<style>
  :root{
    --bg:#0f1117; --panel:#181b24; --panel2:#1f2330; --line:#2b3040;
    --text:#e9ecf3; --dim:#9aa3b8; --accent:#ff3b5c; --accent2:#ffb454;
    --ok:#3ddc97; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{text-align:left;min-height:100vh}
  button{font:inherit;cursor:pointer;border-radius:10px;padding:9px 14px;
    background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button:hover{filter:brightness(1.15)}
  button.primary{background:var(--accent);border-color:var(--accent);font-weight:700;color:#fff}
  select{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;max-width:100%}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 18px;background:rgba(15,17,23,.92);border-bottom:1px solid var(--line)}
  .brand{font-weight:900;letter-spacing:2px;font-size:17px;display:flex;align-items:center;gap:9px;cursor:pointer}
  .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#ff7a45);
    display:grid;place-items:center;font-size:16px;color:#fff;font-weight:900}
  .brand .ai{color:var(--accent);background:rgba(255,59,92,.14);border:1px solid rgba(255,59,92,.4);
    padding:1px 7px;border-radius:7px;font-size:11px;letter-spacing:1px}
  nav{display:flex;gap:6px;margin-left:auto}
  .tab{background:transparent;border-color:transparent;color:var(--dim)}
  .tab.active{background:var(--panel2);border-color:var(--line);color:var(--text)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px}
  .panel{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px}
  .catGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .mCard{background:#141824;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
  .mCard:hover{transform:translateY(-3px);border-color:var(--accent)}
  .mTitle{font-size:12px;font-weight:800;padding:8px 10px;min-height:46px;line-height:1.35}
  .mCoverWrap{position:relative;aspect-ratio:3/4;background:#0a0c12;display:grid;place-items:center;overflow:hidden}
  .mCoverWrap img{width:100%;height:100%;object-fit:cover;display:block}
  .mRate{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.72);border:1px solid var(--line);padding:3px 8px;border-radius:8px;font-size:12px;font-weight:800;color:#ffd75e}
  .mDemo{background:linear-gradient(90deg,#a86e14,#e0a83c);color:#fff;text-align:center;font-weight:800;font-size:13px;padding:6px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cdTop{display:flex;gap:16px;flex-wrap:wrap}
  .cdCover{width:200px;flex-shrink:0}
  .cdCover .mCoverWrap{border-radius:10px;border:1px solid var(--line)}
  .cdInfo{flex:1;min-width:240px}
  .cdTitle{font-size:20px;font-weight:900;margin:0 0 8px}
  .cdSyn{font-size:13px;line-height:1.55;color:#cdd4e3}
  .chipRow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{background:#2456c6;color:#fff;font-size:12px;font-weight:700;border-radius:7px;padding:4px 12px}
  .pill{background:#2a2f3f;border:1px solid var(--line);font-size:12px;border-radius:999px;padding:3px 12px;display:inline-block;margin:2px 4px 2px 0}
  .estadoDot{color:var(--ok);font-weight:800}
  .statRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;background:#10131b;border:1px solid var(--line);border-radius:12px;padding:12px}
  .stat{flex:1;min-width:80px;text-align:center;font-size:12px;color:var(--dim)}
  .stat b{display:block;font-size:17px;color:var(--text)}
  .chapHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
  .chapHead h3{margin:0;color:#7fb3ff}
  .chapRow{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  .chapRow:hover{background:rgba(255,255,255,.03)}
  .chapRow .t{flex:1;min-width:0}
  .chapRow .d{color:var(--dim);font-size:12px;white-space:nowrap}
  /* lector */
  #bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;position:sticky;top:69px;background:var(--bg);padding:8px 0;z-index:5}
  #stage{position:relative;display:inline-block;max-width:100%;background:#05060a;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  #pageImg{max-width:100%;max-height:78vh;display:block}
  .bubble{position:absolute;border:2px solid rgba(255,59,92,.85);border-radius:6px;background:rgba(255,59,92,.10);pointer-events:none}
  .bubble.active{border-color:#ffd75e;background:rgba(255,215,94,.14)}
  #pageTag{color:var(--dim);margin:6px 0;font-size:.9em}
  #trans{display:flex;flex-direction:column;gap:6px;margin-top:12px;max-width:720px}
  .line{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:.95em;line-height:1.4}
  .line:hover{border-color:var(--accent)}
  .line.active{border-color:var(--accent);background:rgba(255,59,92,.10)}
  .line .spk{color:var(--ok);font-weight:bold;font-size:.85em;display:block;margin-bottom:2px}
  #status{color:var(--ok);min-height:1.4em;margin-top:8px;font-size:.9em}
  #loader{margin:30px 0;text-align:center}
  .spin{display:inline-block;width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
  @media (max-width:640px){.cdCover{width:140px}}
</style>
</head>
<body>
<header>
  <div class="brand" id="brandHome"><span class="logo">M</span> MANGA LECTOR <span class="ai">IA</span></div>
  <nav><button class="tab active" id="tabCat">Catálogo</button></nav>
</header>
<div class="wrap">

  <div id="homeView" class="panel">
    <div class="catGrid" id="catGrid"></div>
  </div>

  <div id="detailView" class="panel" hidden>
    <div class="cdTop">
      <div class="cdCover"><div class="mCoverWrap"><img id="dCover" src="cover.jpg" alt="Portada"></div></div>
      <div class="cdInfo">
        <h2 class="cdTitle" id="dTitle"></h2>
        <div id="dMeta"></div>
        <p class="cdSyn" id="dSyn"></p>
        <div class="chipRow" id="dGenres"></div>
      </div>
    </div>
    <div class="statRow" id="dStats"></div>
    <div class="chapHead"><h3>Capítulos</h3></div>
    <div id="chapList"></div>
  </div>

  <div id="readerView" class="panel" hidden>
    <div id="bar">
      <button id="backBtn" title="Volver">☰ Capítulos</button>
      <button id="prevBtn" title="Página anterior">◀</button>
      <button id="playBtn" class="primary" title="Leer en voz alta">▶ Escuchar</button>
      <button id="nextBtn" title="Página siguiente">▶</button>
      <select id="modeSel" title="Idioma">
        <option value="translation">Traducción</option>
        <option value="original">Original</option>
      </select>
      <select id="rateSel" title="Velocidad">
        <option value="0.9">0.9×</option>
        <option value="1" selected>1×</option>
        <option value="1.15">1.15×</option>
        <option value="1.3">1.3×</option>
      </select>
      <button id="boxBtn" title="Cuadros de diálogo">💬</button>
    </div>
    <div id="pageTag"></div>
    <div id="stage">
      <img id="pageImg" alt="Página del manga" referrerpolicy="no-referrer">
      <div id="boxes"></div>
    </div>
    <div id="loader" hidden><span class="spin"></span> <span id="loadTxt">Cargando capítulo…</span></div>
    <div id="status"></div>
    <div id="trans"></div>
  </div>

</div>

<script src="data.js"></script>
<script>
'use strict';
const META = {
  rating: 9.2, demographic: 'Shounen', estado: 'PUBLICÁNDOSE',
  genres: ['Acción','Aventura','Magia','Reencarnación'],
  synopsis: 'Un hombre, que al tratar de salvar a su compañero de trabajo y su novia, fue apuñalado por un ladrón que escapaba. Mientras moría desangrado escuchó una voz extraña. Esta voz escuchó su lamento y le dio la Habilidad Única "Gran Sabio". Ahora ha reencarnado como un Slime en otro mundo. ¿Será este el inicio de una emocionante aventura?'
};
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

const state = {
  chap: null, pages: [], pageIndex: 0, lines: [], lineIndex: -1,
  playing: false, gen: 0, showBoxes: true,
  mode: localStorage.getItem('sl-mode') || 'translation',
  rate: parseFloat(localStorage.getItem('sl-rate') || '1') || 1,
  voice: null,
};
function show(view){
  $('#homeView').hidden = view !== 'home';
  $('#detailView').hidden = view !== 'detail';
  $('#readerView').hidden = view !== 'reader';
  $('#tabCat').classList.toggle('active', view !== 'reader');
  window.scrollTo(0, 0);
}

/* ---------- catálogo ---------- */
function initHome(){
  const g = $('#catGrid'); g.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'mCard';
  card.innerHTML =
    '<div class="mTitle">' + escapeHtml(MANGA.title) + '</div>' +
    '<div class="mCoverWrap"><img src="cover.jpg" alt="Portada"><span class="mRate">★ ' + META.rating.toFixed(2) + '</span></div>' +
    '<div class="mDemo">' + escapeHtml(META.demographic) + '</div>';
  card.onclick = openDetail;
  g.appendChild(card);
  $('#modeSel').value = state.mode;
  $('#rateSel').value = String(state.rate);
}
function openDetail(){
  stopAll();
  $('#dTitle').textContent = MANGA.title;
  $('#dMeta').innerHTML = '<span class="pill estadoDot">● ' + escapeHtml(META.estado) + '</span> <span class="pill">' + escapeHtml(META.demographic) + '</span> <span class="pill">★ ' + META.rating.toFixed(2) + '</span>';
  $('#dSyn').textContent = META.synopsis;
  $('#dGenres').innerHTML = META.genres.map(x=>'<span class="chip">'+escapeHtml(x)+'</span>').join('');
  let total = 0;
  for (const c of CHAPTERS) total += (c.pages || []).length;
  $('#dStats').innerHTML =
    '<div class="stat"><b>' + CHAPTERS.length + '</b>capítulos</div>' +
    '<div class="stat"><b>' + total + '</b>páginas</div>' +
    '<div class="stat"><b>🔊</b>narración incluida</div>';
  const list = $('#chapList'); list.innerHTML = '';
  const sorted = CHAPTERS.slice().sort((a,b)=>b.num - a.num);
  for (const c of sorted){
    const row = document.createElement('div');
    row.className = 'chapRow';
    row.innerHTML = '<div class="t"><b>Capítulo ' + c.num + '</b>' + (c.title ? ' — ' + escapeHtml(c.title) : '') + '</div>' +
      '<div class="d">' + escapeHtml(c.date || '') + ' · ' + (c.pages||[]).length + ' pág.</div>';
    row.onclick = () => openChapter(c.num);
    list.appendChild(row);
  }
  show('detail');
}

/* ---------- red ---------- */
async function fetchBlob(u){
  try {
    const r = await fetch(u, {referrerPolicy:'no-referrer'});
    if (r.ok){ const b = await r.blob(); if (b && b.size > 1000) return b; }
  } catch(e){}
  const r2 = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(u));
  if (!r2.ok) throw new Error('No se pudo descargar la imagen');
  const b2 = await r2.blob();
  if (!b2 || b2.size < 1000) throw new Error('Imagen vacía');
  return b2;
}

/* ---------- corte de tiras largas (determinista) ---------- */
async function stripRowFeats(bmp){
  const H = bmp.height, SW = 90;
  const c = document.createElement('canvas'); c.width = SW; c.height = H;
  const ctx = c.getContext('2d', {willReadFrequently:true});
  ctx.drawImage(bmp, 0, 0, SW, H);
  const px = ctx.getImageData(0, 0, SW, H).data;
  const rows = [];
  for (let y = 0; y < H; y++){
    let w = 0, d = 0;
    for (let x = 0; x < SW; x++){
      const i = (y * SW + x) * 4, j = (Math.min(H - 1, y + 2) * SW + x) * 4;
      if (px[i] > 242 && px[i+1] > 242 && px[i+2] > 242) w++;
      d += Math.abs(px[i]-px[j]) + Math.abs(px[i+1]-px[j+1]) + Math.abs(px[i+2]-px[j+2]);
    }
    rows.push({w:w/SW, d:d/SW});
  }
  return rows;
}
function solveStripDP(rows, H, P, LO, HI){
  const sm = rows.map((r, y)=>{
    let s = 0, n = 0;
    for (let k = -3; k <= 3; k++){ const yy = y+k; if (yy >= 0 && yy < rows.length){ s += rows[yy].d; n++; } }
    return s/n;
  });
  const cands = [];
  for (let y = 4; y < H-4; y++){
    const isPeak = sm[y] >= sm[y-1] && sm[y] >= sm[y+1] && sm[y] > sm[y-4]*1.12 && sm[y] > sm[y+4]*1.12;
    if (rows[y].w >= 0.8 || (isPeak && sm[y] > 40)) cands.push(y);
  }
  const thin = [];
  for (let y = 0; y < H; y += 30){
    let bi = -1, bv = -1;
    for (let k = y; k < Math.min(y+30, H); k++){
      if (cands.indexOf(k) === -1) continue;
      const v = rows[k].w >= 0.8 ? 1000 + rows[k].w : sm[k];
      if (v > bv){ bv = v; bi = k; }
    }
    if (bi >= 0) thin.push(bi);
  }
  const N = thin.length, INF = 1e12;
  const pos = i => i === -1 ? 0 : (i === N ? H : thin[i]);
  const dp = new Array(N+1).fill(INF), par = new Array(N+1).fill(-2);
  const get = i => i === -1 ? 0 : dp[i];
  for (let i = 0; i <= N; i++){
    let best = INF, bj = -2;
    for (let j = -1; j < i; j++){
      const len = pos(i) - pos(j);
      if (len < LO || len > HI) continue;
      const v = get(j) + Math.abs(len - P) * 0.4;
      if (v < best){ best = v; bj = j; }
    }
    dp[i] = best; par[i] = bj;
  }
  if (dp[N] >= INF/2) return null;
  const cuts = [];
  let cur = N;
  while (cur !== -1 && cur !== -2){ if (cur !== N) cuts.unshift(thin[cur]); cur = par[cur]; }
  return {cuts, cost:dp[N]};
}
async function splitStripBlob(blobs){
  const infos = [];
  for (const b of blobs){
    let bmp = null;
    try { bmp = await createImageBitmap(b); } catch(e){}
    let rows = null;
    try { rows = bmp ? await stripRowFeats(bmp) : null; } catch(e){}
    infos.push({b, bmp, rows});
  }
  const strips = infos.filter(x => x.bmp && x.rows && x.bmp.height > x.bmp.width * 2.2);
  if (!strips.length){
    for (const x of infos){ try { x.bmp && x.bmp.close(); } catch(e){} }
    return blobs;
  }
  let bestP = 1450, best = Infinity;
  for (let P = 1000; P <= 1650; P += 50){
    let tot = 0, ok = true;
    for (const s of strips){
      const r = solveStripDP(s.rows, s.bmp.height, P, 700, 2000);
      if (!r){ ok = false; break; }
      tot += r.cost;
    }
    if (ok && tot < best){ best = tot; bestP = P; }
  }
  const pages = [];
  for (const x of infos){
    if (!x.bmp){ pages.push(x.b); continue; }
    if (!x.rows || x.bmp.height <= x.bmp.width * 2.2){ pages.push(x.b); try { x.bmp.close(); } catch(e){} continue; }
    const r = solveStripDP(x.rows, x.bmp.height, bestP, 700, 2000);
    if (!r){ pages.push(x.b); try { x.bmp.close(); } catch(e){} continue; }
    const bounds = [0].concat(r.cuts).concat([x.bmp.height]);
    let okCut = bounds.length >= 3;
    for (let k = 1; okCut && k < bounds.length; k++){
      const len = bounds[k] - bounds[k-1];
      if (len < 600 || len > 2100) okCut = false;
    }
    if (!okCut){ pages.push(x.b); try { x.bmp.close(); } catch(e){} continue; }
    for (let k = 1; k < bounds.length; k++){
      const y0 = bounds[k-1], hh = bounds[k] - y0;
      const cc = document.createElement('canvas'); cc.width = x.bmp.width; cc.height = hh;
      cc.getContext('2d').drawImage(x.bmp, 0, y0, x.bmp.width, hh, 0, 0, x.bmp.width, hh);
      const pb = await new Promise(res => cc.toBlob(res, 'image/jpeg', 0.88));
      if (!pb){ okCut = false; break; }
      pages.push(pb);
    }
    if (!okCut) pages.push(x.b);
    try { x.bmp.close(); } catch(e){}
  }
  return pages;
}

/* ---------- capítulo ---------- */
async function openChapter(num){
  const ch = CHAPTERS.find(c => c.num === num);
  if (!ch) return;
  stopAll();
  state.chap = ch; state.pages = []; state.pageIndex = 0;
  show('reader');
  $('#trans').innerHTML = '';
  $('#boxes').innerHTML = '';
  $('#pageImg').removeAttribute('src');
  $('#loader').hidden = false;
  try {
    const n = ch.strips.length;
    const blobs = [];
    for (let i = 0; i < n; i++){
      $('#loadTxt').textContent = 'Descargando imágenes ' + (i+1) + '/' + n + '…';
      blobs.push(await fetchBlob(ch.strips[i]));
    }
    $('#loadTxt').textContent = 'Preparando páginas…';
    await sleep(30);
    const parts = await splitStripBlob(blobs);
    state.pages = parts.map((b, i) => ({
      url: URL.createObjectURL(b),
      lines: ((ch.pages && ch.pages[i]) || []).map(l => Object.assign({}, l)),
    }));
    $('#loader').hidden = true;
    setPage(0);
    try { localStorage.setItem('sl-last', String(num)); } catch(e){}
  } catch(e){
    $('#loader').hidden = true;
    $('#status').textContent = 'Error: ' + (e && e.message || e);
  }
}
function goToPage(i){ stopAll(); setPage(i); }
function setPage(i){
  if (!state.pages.length) return;
  if (i < 0) i = 0;
  if (i >= state.pages.length) i = state.pages.length - 1;
  state.pageIndex = i;
  state.lines = state.pages[i].lines || [];
  state.lineIndex = -1;
  renderStage();
  renderTranscript();
  window.scrollTo(0, 0);
}
function renderStage(){
  const p = state.pages[state.pageIndex];
  const img = $('#pageImg');
  if (p && p.url && img.getAttribute('src') !== p.url) img.setAttribute('src', p.url);
  $('#pageTag').textContent = (state.chap ? ('Cap. ' + state.chap.num + (state.chap.title ? ' — ' + state.chap.title : '')) : '') +
    ' · Página ' + (state.pageIndex+1) + '/' + state.pages.length;
  renderBoxes();
}
function renderBoxes(){
  const box = $('#boxes'); box.innerHTML = '';
  if (!state.showBoxes) return;
  state.lines.forEach((l, i) => {
    if (!l.box || l.box.length !== 4) return;
    const d = document.createElement('div');
    d.className = 'bubble' + (i === state.lineIndex ? ' active' : '');
    d.style.left = (l.box[0]*100) + '%';
    d.style.top = (l.box[1]*100) + '%';
    d.style.width = (l.box[2]*100) + '%';
    d.style.height = (l.box[3]*100) + '%';
    box.appendChild(d);
  });
}
function lineText(l){
  if (state.mode === 'original') return l.text || l.translation || '';
  return l.translation || l.text || '';
}
function renderTranscript(){
  const t = $('#trans'); t.innerHTML = '';
  state.lines.forEach((l, i) => {
    const d = document.createElement('div');
    d.className = 'line' + (i === state.lineIndex ? ' active' : '');
    d.innerHTML = (l.speaker ? '<span class="spk">' + escapeHtml(l.speaker) + '</span>' : '') + escapeHtml(lineText(l));
    d.onclick = () => { speakFrom(i); };
    t.appendChild(d);
  });
  $('#status').textContent = state.lines.length ? (state.lines.length + ' líneas') : 'Esta página no tiene diálogo.';
}
function setActive(i){
  state.lineIndex = i;
  const els = $('#trans').children;
  for (let k = 0; k < els.length; k++) els[k].classList.toggle('active', k === i);
  const bb = $('#boxes').children;
  for (let k = 0; k < els.length; k++){ if (bb[k]) bb[k].classList.toggle('active', k === i); }
  if (els[i]) els[i].scrollIntoView({block:'nearest', behavior:'smooth'});
}

/* ---------- voz (del propio dispositivo) ---------- */
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices() || [];
    const es = vs.filter(v => /^es/i.test(v.lang || ''));
    if (es.length) return es[0];
    return vs[0] || null;
  } catch(e){ return null; }
}
if ('speechSynthesis' in window){
  try {
    speechSynthesis.onvoiceschanged = () => { state.voice = pickVoice(); };
    state.voice = pickVoice();
  } catch(e){}
}
function speakText(text){
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)){ resolve(); return; }
    try { speechSynthesis.cancel(); } catch(e){}
    const u = new SpeechSynthesisUtterance(text);
    if (state.voice) u.voice = state.voice;
    u.lang = (state.voice && state.voice.lang) || 'es-ES';
    u.rate = state.rate || 1;
    let done = false;
    const fin = () => { if (!done){ done = true; resolve(); } };
    u.onend = fin; u.onerror = fin;
    setTimeout(fin, Math.max(4000, text.length * 350));
    try { speechSynthesis.resume(); } catch(e){}
    try { speechSynthesis.speak(u); } catch(e){ fin(); }
  });
}
function stopAll(){
  state.gen++;
  state.playing = false;
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
  $('#playBtn').textContent = '▶ Escuchar';
}
async function speakFrom(i){
  const gen = ++state.gen;
  stopAll(); state.gen = gen;
  if (!('speechSynthesis' in window)){
    $('#status').textContent = 'Tu navegador no tiene voz incorporada. Prueba con Chrome o Edge.';
    return;
  }
  try { speechSynthesis.cancel(); } catch(e){}
  try { speechSynthesis.resume(); } catch(e){}
  state.voice = pickVoice();
  if (!state.voice){
    try {
      await new Promise(r=>{
        let done = false;
        const fin = ()=>{ if(!done){ done=true; r(); } };
        speechSynthesis.onvoiceschanged = ()=>{ state.voice = pickVoice(); fin(); };
        setTimeout(fin, 1500);
      });
    } catch(e){}
  }
  state.playing = true;
  $('#playBtn').textContent = '⏸ Detener';
  let k = (typeof i === 'number' && i >= 0) ? i : 0;
  while (state.gen === gen && state.playing){
    const lines = state.lines;
    if (k >= lines.length){
      if (state.pageIndex < state.pages.length - 1){
        setPage(state.pageIndex + 1);
        k = 0;
        continue;
      }
      $('#status').textContent = 'Fin del capítulo.';
      break;
    }
    setActive(k);
    const t = lineText(lines[k]);
    if (t && t.trim()) await speakText(t);
    if (state.gen !== gen || !state.playing) break;
    k++;
    await sleep(250);
  }
  if (state.gen === gen){
    state.playing = false;
    $('#playBtn').textContent = '▶ Escuchar';
  }
}

/* ---------- controles ---------- */
$('#brandHome').onclick = $('#tabCat').onclick = () => {
  stopAll();
  for (const p of state.pages){ try { URL.revokeObjectURL(p.url); } catch(e){} }
  state.pages = []; state.chap = null;
  show('home');
};
$('#backBtn').onclick = () => {
  stopAll();
  for (const p of state.pages){ try { URL.revokeObjectURL(p.url); } catch(e){} }
  state.pages = []; state.chap = null;
  openDetail();
};
$('#prevBtn').onclick = () => goToPage(state.pageIndex - 1);
$('#nextBtn').onclick = () => goToPage(state.pageIndex + 1);
$('#playBtn').onclick = () => {
  if (state.playing){ stopAll(); setActive(-1); renderTranscript(); return; }
  speakFrom(state.lineIndex >= 0 ? state.lineIndex : 0);
};
$('#modeSel').onchange = e => {
  state.mode = e.target.value;
  try { localStorage.setItem('sl-mode', state.mode); } catch(err){}
  renderTranscript();
};
$('#rateSel').onchange = e => {
  state.rate = parseFloat(e.target.value) || 1;
  try { localStorage.setItem('sl-rate', String(state.rate)); } catch(err){}
};
$('#boxBtn').onclick = () => { state.showBoxes = !state.showBoxes; renderBoxes(); };
document.addEventListener('keydown', e => {
  if ($('#readerView').hidden) return;
  if (e.key === 'ArrowLeft') goToPage(state.pageIndex - 1);
  if (e.key === 'ArrowRight') goToPage(state.pageIndex + 1);
  if (e.key === ' '){ e.preventDefault(); $('#playBtn').click(); }
});

initHome();
</script>
